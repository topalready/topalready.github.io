name: Refresh data and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"   # 3am Singapore time, daily
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[data]')
        run: python scripts/update.py
      - name: Refresh satellite snapshot list
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/aerial.py
      - name: Keep photo storage awake
        if: github.event_name == 'schedule'
        run: |
          curl -s -o /dev/null -w "Supabase ping %{http_code}\n" \
            "https://dykbqyaftkeiroyfzoqb.supabase.co/rest/v1/photos?select=id&limit=1" \
            -H "apikey: sb_publishable_6zJTBBa74WI7IueK3xdaUg_cvfxMSp2" || true
      - name: Save refreshed data
        run: |
          git config user.name "storeys-bot"
          git config user.email "storeys-bot@users.noreply.github.com"
          git add data.json aerial.json
          git diff --cached --quiet || git commit -m "Daily data refresh [data]" && git push || true
      - name: Build project link pages
        run: |
          pip install --quiet pillow
          python scripts/pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deploy
        uses: actions/deploy-pages@v4
