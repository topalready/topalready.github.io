name: Prototype run
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet rasterio numpy pillow
      - run: python scripts/proto/sentinel_test.py
        env:
          AWS_NO_SIGN_REQUEST: "YES"
          GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      - name: Save to the "proto" branch
        run: |
          cd out && git init --quiet -b proto
          git config user.name "storeys-bot" && git config user.email "storeys-bot@users.noreply.github.com"
          git add . && git commit --quiet -m "Prototype output"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" proto
