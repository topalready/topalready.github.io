name: Screenshot the app for posts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Folder name for this batch (e.g. 2026-11-11)"
        required: true
      projects:
        description: "Project slugs, comma-separated (as in /p/<slug>/)"
        required: true
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Take screenshots
        env:
          TAG: ${{ github.event.inputs.tag }}
          PROJECTS: ${{ github.event.inputs.projects }}
        run: python scripts/posts/screens.py "$TAG" "$PROJECTS"
      - name: Save screenshots to the "screens" branch
        # Kept off main on purpose: screenshots are big, and main is what gets published as the site.
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir /tmp/out && mv "social/screens/$TAG" /tmp/out/
          cd /tmp/out
          git init --quiet -b screens
          git config user.name "storeys-bot"
          git config user.email "storeys-bot@users.noreply.github.com"
          git add . && git commit --quiet -m "Site screenshots for posts ($TAG)"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens
